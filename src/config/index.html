<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>WristWake</title>
<style>
  /* Layout modeled on Clay (Pebble's standard settings pages, MIT license),
     colors as a darker night variant with a muted orange. Clay's own font
     (PF Din, licensed) is not used; a similar condensed system font instead. */
  :root {
    --bg: #0c0e12;          /* Clay: #333333 */
    --section: #181b21;     /* Clay: #484848 */
    --heading: #13161b;     /* Clay: #414141 */
    --divider: #262b33;     /* Clay: #666666 */
    --shadow: #050608;      /* Clay: #2f2f2f */
    --text: #d6dae1;        /* Clay: #ffffff */
    --desc: #7a8291;        /* Clay: #a4a4a4 */
    --field: #0c0e12;       /* Clay: #333333 */
    --placeholder: #4d5462; /* Clay: #858585 */
    --orange: #b8410e;      /* Clay: #ff4700 */
    --orange-hi: #d24c12;   /* Clay: #ff0000 (pressed) */
    --button: #2c313a;      /* Clay: #767676 */
    --button-hi: #3a404b;   /* Clay: #858585 */
    --ok: #1f7a3c; --err: #d65151;
    --din: "sans-serif-condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background-color: var(--bg); color: var(--text); font-size: 17px; line-height: 1.4;
               font-family: var(--din); -webkit-font-smoothing: antialiased; }
  body { padding: 0 0.75rem 0.7rem; }
  h1, h4 { text-transform: uppercase; font-weight: 500; position: relative; top: 0.05rem; line-height: 0.9; }
  h1 { font-size: 2rem; line-height: 2.8rem; }
  h4 { font-size: 1.2rem; line-height: 1.4rem; }
  .page-title { padding: 0.7rem 0.75rem 0; }
  .component { padding-top: 0.7rem; }
  .section { background: var(--section); border-radius: 0.25rem; box-shadow: var(--shadow) 0 0.15rem 0.25rem;
             margin-top: 1rem; }
  .section .component { padding: 0 0.75rem 0.7rem; position: relative; }
  .section .component + .component::after,
  .section .component + div > .component:first-child::after,
  #alarms > .component.alarm-head::after { content: ""; background: var(--divider); display: block;
             position: absolute; top: 0; left: 0.375rem; right: 0.375rem; height: 1px; }
  #alarms > .component + .component-input::after { display: none; }
  .section > .component-heading:first-child { background: var(--heading); border-radius: 0.25rem 0.25rem 0 0;
             padding-top: 0.7rem; padding-bottom: 0.7rem; }
  .section > .component-heading + .component::after { display: none; }
  label, .row { display: flex; justify-content: space-between; align-items: center; padding: 0.7rem 0.75rem;
                margin: 0 -0.75rem; }
  .tap-highlight { -webkit-tap-highlight-color: rgba(255,255,255,0.06); border-radius: 0.25rem; cursor: pointer; }
  .tap-highlight:active { background-color: rgba(255,255,255,0.06); }
  .description { padding: 0 0 0.7rem; font-size: 0.9rem; line-height: 1.4rem; color: var(--desc); }
  .component-input label { display: block; }
  .component-input .input { margin-top: 0.7rem; display: block; }
  input[type=text], input[type=password], input[type=url] {
    display: block; width: 100%; background: var(--field); border-radius: 0.25rem; border: none;
    padding: 0.35rem 0.375rem; color: var(--text); font: inherit; min-height: 2.1rem; appearance: none; }
  input::placeholder { color: var(--placeholder); }
  input:focus { outline: 1px solid var(--orange); }
  .component-select .value { position: relative; padding-right: 1.1rem; }
  .component-select .value::after { content: ""; position: absolute; right: 0; top: 50%; margin-top: -0.1rem;
             border-left: 0.3rem solid transparent; border-right: 0.3rem solid transparent;
             border-top: 0.4rem solid var(--orange); }
  .component-select select { position: absolute; inset: 0; opacity: 0; width: 100%; font: inherit; }
  .component-select label { position: relative; }
  .component-color .value { width: 2.3rem; height: 1.4rem; border-radius: 0.7rem; display: block;
             box-shadow: 0 0.1rem 0.1rem var(--shadow); flex: none; }
  button { font-family: var(--din); font-weight: 500; font-size: 1rem; line-height: 1.4rem; text-transform: uppercase;
           background-color: var(--button); border-radius: 0.25rem; border: none; display: inline-block;
           color: var(--text); min-width: 12rem; text-align: center; padding: 0.6rem; cursor: pointer; }
  button:active { background-color: var(--button-hi); }
  button.primary { background-color: var(--orange); color: #fbeee6; }
  button.primary:active { background-color: var(--orange-hi); }
  button.small { min-width: 0; padding: 0.35rem 0.9rem; font-size: 0.95rem; }
  button:disabled { opacity: 0.4; }
  button.saved, button.saved:disabled { background-color: var(--ok); color: #eafbee; opacity: 1; }
  .component-submit { text-align: center; padding-top: 1rem; }
  .buttons { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; padding-bottom: 0.7rem; }
  .status { font-size: 0.9rem; line-height: 1.3rem; color: var(--desc); }
  .status:empty { display: none; }
  .status.ok { color: #4fa36a; } .status.err { color: var(--err); }
  .alarm-time small { font-size: 0.85rem; color: var(--desc); text-transform: none; }
  .preview { margin: 0 0 0.7rem; border-radius: 0.25rem; overflow: hidden; font-weight: 500; }
  .preview div { padding: 0.45rem 0.6rem; }
  .footnote { color: var(--desc); font-size: 0.8rem; text-align: center; padding-top: 0.5rem; }
  /* Color picker like Clay: honeycomb of the 64 watch colors in a popup */
  .picker-wrap { position: fixed; inset: 0; padding: 0.7rem 0.375rem; background: rgba(0,0,0,0.7);
                 display: flex; justify-content: center; align-items: center; z-index: 100; }
  .picker { padding: 0.7rem 0.75rem; background: var(--section); border-radius: 0.25rem; width: 100%;
            max-width: 26rem; box-shadow: 0 0.18rem 0.9rem rgba(0,0,0,0.6); }
  .color-grid { display: grid; grid-template-columns: repeat(9, 1fr); }
  .color-grid i { aspect-ratio: 1; display: block; }
  .color-grid i.sel { cursor: pointer; }
  .color-grid i.selected { transform: scale(1.1); border-radius: 0.25rem; box-shadow: #000 0 0 0.24rem;
                           position: relative; z-index: 1; }
  /* Toggle like Clay: track with knob, on = orange */
  .component-toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .component-toggle .track { position: relative; width: 2.3rem; height: 1.4rem; border-radius: 0.7rem;
             background: var(--button); flex: none; transition: background 0.15s; }
  .component-toggle .track::after { content: ""; position: absolute; top: 0.15rem; left: 0.15rem; width: 1.1rem;
             height: 1.1rem; border-radius: 50%; background: var(--desc); transition: left 0.15s, background 0.15s; }
  .component-toggle input:checked + .track { background: var(--orange); }
  .component-toggle input:checked + .track::after { left: 1.05rem; background: #fbeee6; }
  .hide, .hidden { display: none !important; }
  input[type=time] { background: var(--field); border-radius: 0.25rem; border: none; color: var(--text);
             font: inherit; padding: 0.2rem 0.4rem; min-height: 2.1rem; color-scheme: dark; }
  input[type=time].err { outline: 1px solid var(--err); }
  .sun-time { flex: 1; text-align: left; padding-left: 0.5rem; color: var(--desc); }
  .offset { display: flex; gap: 0.4rem; align-items: center; }
  .offset select { background: var(--field); border-radius: 0.25rem; border: none; color: var(--text);
             font: inherit; min-height: 2.1rem; padding: 0 0.5rem; }
  .preview-label { font-size: 0.9rem; color: var(--desc); padding-bottom: 0.4rem; }
  .shots { display: flex; gap: 0.6rem; }
  .shots canvas { flex: 1; min-width: 0; width: 50%; height: auto; border-radius: 0.25rem; }
</style>
</head>
<body>
<div class="page-title"><h1>WristWake</h1></div>
<p id="loading" class="status" style="padding:0 0.75rem">…</p>

<div id="content" class="hidden">
  <div class="section">
    <div class="component component-heading"><h4 data-t="ha_title"></h4></div>
    <div class="component">
      <p id="ha-status" class="status" style="padding-top:0.7rem"></p>
    </div>
    <div class="component component-input">
      <label><span data-t="ha_url"></span>
        <span class="input"><input id="ha-url" type="url" placeholder="https://xyz.ui.nabu.casa" autocomplete="off"></span>
      </label>
    </div>
    <div class="component component-input">
      <label><span data-t="ha_token"></span>
        <span class="input"><input id="ha-token" type="password" autocomplete="off"></span>
      </label>
      <div class="description" data-t="ha_token_hint"></div>
      <div class="buttons">
        <button id="ha-connect" class="small primary" data-t="ha_connect"></button>
        <button id="ha-disconnect" class="small hidden" data-t="ha_disconnect"></button>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="component component-heading"><h4 data-t="watch_title"></h4></div>
    <div class="component component-input">
      <label><span data-t="watch_name"></span>
        <span class="input"><input id="watch-name" type="text" maxlength="40"></span>
      </label>
      <div class="description" data-t="watch_name_hint"></div>
    </div>
    <div class="component component-toggle">
      <label class="tap-highlight"><span data-t="left_handed"></span>
        <input id="left-handed" type="checkbox"><span class="track"></span>
      </label>
      <div class="description" data-t="left_handed_hint"></div>
    </div>
  </div>

  <div class="section">
    <div class="component component-heading"><h4 data-t="alarms_title"></h4></div>
    <div class="component"><div class="description" style="padding-top:0.7rem" data-t="alarms_help"></div></div>
    <div id="alarms"></div>
  </div>

  <div class="section">
    <div class="component component-heading"><h4 data-t="sym_title"></h4></div>
    <div class="component"><div class="description" style="padding-top:0.7rem" data-t="sym_help"></div></div>
    <div class="component component-toggle">
      <label class="tap-highlight"><span data-t="sym_list"></span>
        <input id="sym-list" type="checkbox"><span class="track"></span>
      </label>
    </div>
    <div class="component component-toggle">
      <label class="tap-highlight"><span data-t="sym_menu"></span>
        <input id="sym-menu" type="checkbox"><span class="track"></span>
      </label>
    </div>
    <div class="component component-toggle">
      <label class="tap-highlight"><span data-t="sym_ring"></span>
        <input id="sym-ring" type="checkbox"><span class="track"></span>
      </label>
    </div>
    <div class="component component-toggle">
      <label class="tap-highlight"><span data-t="sym_ha"></span>
        <input id="sym-ha" type="checkbox"><span class="track"></span>
      </label>
    </div>
  </div>

  <div class="section" id="design-section">
    <div class="component component-heading"><h4 data-t="design_title"></h4></div>
    <div class="component component-select">
      <label class="tap-highlight"><span id="design-label"></span>
        <span class="value" id="theme-label"></span>
        <select id="theme">
          <option value="3">Cerulean Blue</option>
          <option value="8">Berry</option>
          <option value="9">Lavender</option>
          <option value="10">Mint</option>
          <option value="4">Cerulean Night</option>
          <option value="5">Forest</option>
          <option value="6">Night Light</option>
          <option value="7">High Contrast</option>
          <option value="0" data-t="light"></option>
          <option value="1" data-t="dark"></option>
          <option value="2">Custom</option>
        </select>
      </label>
    </div>
    <div class="component component-select">
      <label class="tap-highlight"><span data-t="sched_label"></span>
        <span class="value" id="sched-label"></span>
        <select id="sched">
          <option value="0" data-t="sched_off"></option>
          <option value="1" data-t="sched_times"></option>
          <option value="2" data-t="sched_sun"></option>
        </select>
      </label>
    </div>
    <div id="sched-box" class="hidden">
      <div class="component component-select">
        <label class="tap-highlight"><span data-t="night_label"></span>
          <span class="value" id="night-label"></span>
          <select id="theme-night"></select>
        </label>
      </div>
      <div id="sched-times">
        <div class="component"><label><span data-t="day_from"></span><input id="day-time" type="time"></label></div>
        <div class="component"><label><span data-t="night_from"></span><input id="night-time" type="time"></label>
          <p id="times-err" class="status err"></p></div>
      </div>
      <div id="sched-sun">
        <div class="component"><label><span data-t="sun_day"></span><span id="day-sun" class="sun-time"></span>
          <span class="offset"><select id="day-sign"><option value="1">+</option><option value="-1">−</option></select>
          <select id="day-h"></select>h <select id="day-m"></select>min</span></label></div>
        <div class="component"><label><span data-t="sun_night"></span><span id="night-sun" class="sun-time"></span>
          <span class="offset"><select id="night-sign"><option value="1">+</option><option value="-1">−</option></select>
          <select id="night-h"></select>h <select id="night-m"></select>min</span></label>
          <p id="sun-today" class="status"></p></div>
      </div>
    </div>
    <div id="custom" class="hidden"></div>
    <div class="component" id="preview-wrap"><p id="preview-label" class="preview-label"></p>
      <div id="preview" class="preview"></div>
      <div id="shots" class="shots">
        <canvas id="shot-list" width="200" height="228"></canvas>
        <canvas id="shot-menu" width="200" height="228"></canvas>
      </div>
    </div>
  </div>

  <div class="component component-submit">
    <button id="save" class="primary" data-t="save" disabled></button>
    <p id="save-status" class="status"></p>
    <p id="mode" class="footnote"></p>
    <p id="version" class="footnote"></p>
  </div>
</div>

  var TEXT = {

      err_no_state: 'No data from the watch yet. Is WristWake open on the watch?',

      watch_title: 'Watch', watch_name: 'Watch name', watch_name_hint: 'Used as the device name in Home Assistant.',
      sym_title: 'Alarm symbols', sym_help: 'Choose the symbol of an alarm on the watch in the alarm menu under “Symbol”. Here you set where it is shown.',
      sym_list: 'In the alarm list', sym_menu: 'In the alarm menu', sym_ring: 'When ringing', sym_ha: 'In Home Assistant (as icon)',

      design_day: 'Daylight color scheme', night_label: 'Darkness color scheme',
      sched_label: 'Daylight/darkness switch', sched_off: 'Off', sched_times: 'Fixed times', sched_sun: 'Sun position',

      sun_day: 'Daylight: sunrise', sun_night: 'Darkness: sunset',

      mode_fallback: 'Connection to the app: fallback (the page closes when saving)'
    }
  };
  var lang = (navigator.language || 'en').slice(0, 2) === 'de' ? 'de' : 'en';
  function t(key) { return TEXT[lang][key] || key; }

  // Inserted by the phone part when opening (watch state), see index.js "showConfiguration"
  var INITIAL = null;
  /*__WW_INITIAL__*/
  // Direct connection to the app available? The Pebble app may only provide it after loading,
  // so it is checked on every action. Without it: fallback, hand over everything on close.
  function hasBridge() {
    return !!(window.Pebble && typeof window.Pebble.sendMessage === 'function');
  }
  var bridge = hasBridge();
  var state = null, haInfo = null;
  var colors = [0xFF, 0xC0, 0xC0, 0xFF];  // GColor8 (argb): white, black, black, white
  var COLOR_KEYS = ['c_bg', 'c_fg', 'c_hlbg', 'c_hlfg'];

  function $(id) { return document.getElementById(id); }

  function applyTexts() {
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t(el.getAttribute('data-t')); });
  }

  // Fallback: close the page and hand everything over to the phone part
  function closeWith(payload) {
    location.href = 'pebblejs://close#' + encodeURIComponent(JSON.stringify(payload));
  }

  function call(message) {
    bridge = hasBridge();
    if (!bridge) return Promise.reject(new Error('no_bridge'));
    return Pebble.sendMessage('pkjs', message).then(function (reply) {
      if (reply && reply.error && !reply.ha && message.type !== 'connect') throw new Error(reply.error);
      return reply;
    });
  }

  // GColor8 (2 bits per channel) <-> CSS
  function css(argb) {
    var r = ((argb >> 4) & 3) * 85, g = ((argb >> 2) & 3) * 85, b = (argb & 3) * 85;
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function renderHa() {
    var el = $('ha-status');
    el.className = 'status';
    if (haInfo && haInfo.deleted) {

  function schedMode() { return +$('sched').value || 0; }
  function nightTheme() { return +$('theme-night').value || 0; }
  function toTime(min) { min = ((min % 1440) + 1440) % 1440; return pad(Math.floor(min / 60)) + ':' + pad(min % 60); }
  function fromTime(value) {
    var m = /^(\d{1,2}):(\d{2})/.exec(value || '');
    return m ? Math.min(+m[1], 23) * 60 + Math.min(+m[2], 59) : 0;
  }
  function selectLabel(id) {
    var sel = $(id);
    return sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].textContent : '';
  }
  // Offset = a duration (sign, 0-12 hours, minutes in steps of 5), not a time of day
  ['day', 'night'].forEach(function (prefix) {
    var h = '', m = '';
    for (var i = 0; i <= 12; i++) h += '<option value="' + i + '">' + i + '</option>';
    for (var j = 0; j < 60; j += 5) m += '<option value="' + j + '">' + pad(j) + '</option>';
    $(prefix + '-h').innerHTML = h;
    $(prefix + '-m').innerHTML = m;
  });
  function offsetOf(prefix) {
    return (+$(prefix + '-sign').value) * ((+$(prefix + '-h').value) * 60 + (+$(prefix + '-m').value));
  }
  function setOffset(prefix, minutes) {
    var abs = Math.min(Math.round(Math.abs(minutes) / 5) * 5, 12 * 60);
    $(prefix + '-sign').value = minutes < 0 ? '-1' : '1';
    $(prefix + '-h').value = String(Math.floor(abs / 60));
    $(prefix + '-m').value = String(abs % 60);
  }

  function renderSunToday() {

    $('day-sun').textContent = toTime(sunToday.rise + offsetOf('day'));

    Pebble.addEventListener('ready', function (e) {
      if (e.target !== 'pkjs' || state) return;
      call({ type: 'get' }).then(function (reply) {
        if (!start(reply)) setStatus($('loading'), t('err_no_state'), 'err');
      }).catch(function (e) { setStatus($('loading'), e.message, 'err'); });
    });
  }

  // The connection may appear after loading: wait up to 3 seconds
  var waited = 0;
  (function waitForBridge() {
    if (hasBridge()) {
      bridge = true;
      $('mode').textContent = t('mode_direct');
      attachBridge();
      return;
    }
    if (waited >= 3000) {
      $('mode').textContent = t('mode_fallback');
      if (!started) setStatus($('loading'), t('err_no_state'), 'err');
      return;
    }
    waited += 100;
    setTimeout(waitForBridge, 100);
  })();
})();
</script>
</body>
</html>
